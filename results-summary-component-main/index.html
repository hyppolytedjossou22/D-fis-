<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <title>Frontend Mentor | Results summary component</title>
  </head>
  <body>
    <main class="card">
      <section class="partie1" aria-label="Résultat du test">
        <p class="result-label">Your Result</p>

        <div class="sac" aria-label="Score global 76 sur 100">
          <h1>76</h1>
          <p class="p">of 100</p>
        </div>

        <h2>Great</h2>
        <p class="result-copy">
          You scored higher than 65% of<br />
          the people who have taken<br />
          these tests.
        </p>
      </section>

      <section class="partie2" aria-label="Résumé des résultats">
        <h2>Summary</h2>

        <ul class="summary-list">
          <li class="tab1">
            <div class="category">
              <img src="./assets/images/icon-reaction.svg" alt="" aria-hidden="true" />
              <span>Reaction</span>
            </div>
            <span class="score"><strong>80</strong> / 100</span>
          </li>

          <li class="tab2">
            <div class="category">
              <img src="./assets/images/icon-memory.svg" alt="" aria-hidden="true" />
              <span>Memory</span>
            </div>
            <span class="score"><strong>92</strong> / 100</span>
          </li>

          <li class="tab3">
            <div class="category">
              <img src="./assets/images/icon-verbal.svg" alt="" aria-hidden="true" />
              <span>Verbal</span>
            </div>
            <span class="score"><strong>61</strong> / 100</span>
          </li>

          <li class="tab4">
            <div class="category">
              <img src="./assets/images/icon-visual.svg" alt="" aria-hidden="true" />
              <span>Visual</span>
            </div>
            <span class="score"><strong>72</strong> / 100</span>
          </li>
        </ul>

        <button type="button">Continue</button>
      </section>
    </main>

    <footer class="attribution">
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Hyppolyte</a>.
    </footer>
  </body>
</html>
