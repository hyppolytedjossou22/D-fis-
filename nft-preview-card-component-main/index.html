<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  
  <title>Frontend Mentor | NFT preview card component</title>

</head>
<body>
<main>
  <div class="tab1">

        <img src="./images/image-equilibrium.jpg" alt="Equilibrium">
        <h2>Equilibrium #3429</h2>

        <p>Our Equilibrium collection promotes balance and calm.</p>

  </div>
  <div class="tab2">
        <p class="element1"><img src="./images/icon-ethereum.svg" alt="icone">  0.041 ETH</p>
        <p class="element2"><img src="./images/icon-clock.svg" alt="icone"> 3 days left</p>
  </div>
  <div class="tab3">
        <img src="./images/image-avatar.png" alt="avatar">
        <p><span class="element1">Creation of</span> <span class="element2">Jules Wyvern</span></p>
  </div>
</main>
  <footer class="attribution">
        <p>Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
          Coded by <a href="#">Hyppolyte</a>.</p>
  </footer>
</body>
</html>
