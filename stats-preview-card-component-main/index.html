<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&family=Lexend+Deca:wght@400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Frontend Mentor | Stats preview card component</title>
  </head>
  <body>
    <main class="card">
      <section class="card__content">
        <div class="card__text">
          <h1>Get <span>insights</span> that help your business grow.</h1>
          <p>
            Discover the benefits of data analytics and make better decisions regarding
            revenue, customer experience, and overall efficiency.
          </p>
        </div>

        <ul class="stats" aria-label="Business statistics">
          <li class="stat">
            <strong>10k+</strong>
            <span>companies</span>
          </li>
          <li class="stat">
            <strong>314</strong>
            <span>templates</span>
          </li>
          <li class="stat">
            <strong>12M+</strong>
            <span>queries</span>
          </li>
        </ul>
      </section>

      <div class="card__media" aria-label="Business team working in an office">
        <picture>
          <source media="(max-width: 700px)" srcset="./images/image-header-mobile.jpg" />
          <img src="./images/image-header-desktop.jpg" alt="People working together in an office" />
        </picture>
      </div>
    </main>

    <footer class="attribution">
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Your Name Here</a>.
    </footer>
  </body>
</html>
