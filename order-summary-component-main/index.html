<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Outfit:wght@100..900&family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  
  <title>Frontend Mentor | Order summary card</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  
</head>
<body>
<main>
  <section class="tab1">
    <img src="./images/illustration-hero.svg" alt="Photo">
    <h2 class="element1">Order Summary</h2>

    <p class="element2">You can now listen to millions of songs, audiobooks, and podcasts on any 
      device anywhere you like!</p>
  </section>
  <section class="tab2">
    <img src="./images/icon-music.svg" alt="icone">
    <div class="element0">
      <p class="element1">Annual Plan</p>
      <p class="element2">$59.99/year</p>
    </div>
    <a href="#">Change</a>
  </section>
  <section class="tab3">
    <button class="element1">Proceed to Payment</button>
    <button class="element2">Cancel Order</button>
  </section>
</main>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Hyppolyte</a>.
  </footer>
</body>
</html>
